<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client & Contractor Login | ServicePro</title>
  <meta name="description" content="Sign in to your ServicePro client portal to track active stone fabrication orders, inspect estimates, or review installation dates.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-surface-alt py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-logo auth-brand-logo justify-content-center mb-3">
            <img src="assets/images/logo.png" alt="Marblon - Tile &amp; Marble Studio" class="brand-logo-img">
          </a>
          <p class="text-muted small">Client Portal & Contractor Job Management</p>
        </div>

        <div class="sp-card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="h4 fw-bold mb-0">Sign In</h3>
            <div class="d-flex align-items-center gap-1 gap-sm-2">
              <button class="dir-toggle-btn" aria-label="Toggle Direction RTL/LTR" title="Toggle RTL / LTR Direction">
                <i class="fas fa-right-left"></i>
              </button>
              <button class="theme-toggle-btn" aria-label="Toggle Theme">
                <i class="fas fa-moon"></i>
              </button>
            </div>
          </div>

          <form class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" placeholder="name@domain.com" value="admin@serviceprostone.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold">Password</label>
                <a href="#" class="small text-primary">Forgot Password?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" placeholder="••••••••" value="password123" required>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember this device for 30 days
              </label>
            </div>

            <a href="dashboard.html" class="btn btn-gold w-100 py-3 fw-bold mb-3">
              <i class="fas fa-right-to-bracket me-2"></i> Sign In to Portal
            </a>
            
            <div class="text-center">
              <small class="text-muted">Demo Access: Click "Sign In to Portal" to enter the <a href="dashboard.html" class="fw-bold text-primary">Admin Dashboard</a>.</small>
            </div>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Don't have a trade account yet? </span>
            <a href="register.html" class="small fw-bold text-primary">Register Here</a>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="index.html" class="text-muted small"><i class="fas fa-arrow-left me-1"></i> Return to Main Website</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
